  <script>
    const table = document.querySelector('table')
    let code = ""
    let game = "X"
    let auto = "0"
    let timeOut

    function xox() {
      for (let i = 0; i < 3; i++) {
        code+= `<tr>`
        for (let i = 0; i < 3; i++) {
            code+= `<td onclick = play(this)></td>`;
        }
        code+= `</tr>`
      }  
      table.innerHTML = code
    }
    xox()

    function play(x) {
      if (x.innerHTML === "") {
        x.innerHTML = game
        
        timeOut = setTimeout(autoPlay, 1000)
        if(checkWin()){return}
}
    }

    function checkWin() {
      const cells = document.querySelectorAll("td")

      const win = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]]
      
      for (const element of win) {
       const [a, b, c] = element
      

      if (cells[a].innerHTML !== "" &&
          cells[a].innerHTML === cells[b].innerHTML &&
          cells[a].innerHTML ===cells[c].innerHTML) {
        alert(cells[a].innerHTML + " is Winner!")
        return true
      }
    }
    return false
    }
    
    function autoPlay() {
      const cells = document.querySelectorAll("td")
      const emptyCell = Array.from(cells).filter((cell)=>cell.innerHTML==="")

      if (emptyCell.length > 0) {
        const randomCell = Math.floor(Math.random()*emptyCell.length)
        emptyCell[randomCell].innerHTML = auto

        checkWin()
      }
    }

    function tryAgain() {
      clearTimeout(timeOut)
      const cells = document.querySelectorAll("td")

      cells.forEach(cell => {cell.innerHTML = "" });
      game = "X"
      return
    }
    
  </script>
